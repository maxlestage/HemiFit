    <!-- wasm-opt doit connaître les fonctionnalités WebAssembly que Rust
         active par défaut (toutes reconnues par Safari depuis iOS 15). -->
    
<script type="module">
import init, * as bindings from '/hemifit-33a44a0116e9b7a5.js';
const wasm = await init({ module_or_path: '/hemifit-33a44a0116e9b7a5_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    
    
    
    
    
    
  <link rel="modulepreload" href="/hemifit-33a44a0116e9b7a5.js" crossorigin="anonymous"><link rel="preload" href="/hemifit-33a44a0116e9b7a5_bg.wasm" crossorigin="anonymous" as="fetch" type="application/wasm"></head>

      <p class="rideau-marque"><span>HemiFit</span></p>
      <p class="rideau-devise"><span>Un petit mouvement à la fois</span></p>

    </div>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="HemiFit">
  <title>HemiFit</title>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f74ad"/>
      <stop offset="1" stop-color="#182f49"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#fond)"/>
  <!-- Anneau ouvert : l'anneau du minuteur, signature de l'application. -->
  <circle cx="512" cy="512" r="290" fill="none" stroke="#fff" stroke-width="84"
          stroke-linecap="round" stroke-dasharray="1518 1823"
          transform="rotate(-90 512 512)"/>
  <circle cx="512" cy="512" r="80" fill="#fff"/>
</svg>

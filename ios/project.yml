# Génération du projet Xcode avec XcodeGen :
#   brew install xcodegen
#   cd ios && xcodegen generate
# Puis ouvrir HemiFit.xcodeproj dans Xcode.
name: HemiFit
options:
  bundleIdPrefix: com.maxlestage
  deploymentTarget:
    # iOS 26 : si votre iPhone tourne sur une version plus ancienne,
    # abaissez ce nombre (par exemple "18.0") et régénérez le projet.
    iOS: "26.0"
  xcodeVersion: "26.6"
settings:
  base:
    SWIFT_VERSION: "6.3"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: HemiFit
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  HemiFit:
    type: application
    platform: iOS
    sources:
      - HemiFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.hemifit
        TARGETED_DEVICE_FAMILY: "1"

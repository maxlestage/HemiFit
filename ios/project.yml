# Génération du projet Xcode avec XcodeGen :
#   brew install xcodegen
#   cd ios && xcodegen generate
# Puis ouvrir HemiFit.xcodeproj dans Xcode.
name: HemiFit
options:
  bundleIdPrefix: com.maxlestage
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: HemiFit
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  HemiFit:
    type: application
    platform: iOS
    sources:
      - HemiFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.hemifit
        TARGETED_DEVICE_FAMILY: "1"

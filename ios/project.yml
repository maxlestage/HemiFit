# ⚠️ Le projet HemiFit.xcodeproj est versionné et fait foi : il s'ouvre
# directement dans Xcode, sans rien installer. Ce fichier n'est conservé
# que comme mémo lisible des réglages. Lancer « xcodegen generate »
# écraserait le projet existant — ne le faire qu'en connaissance de cause,
# et reporter ensuite les réglages ci-dessous s'ils ont divergé.
name: HemiFit
options:
  bundleIdPrefix: com.maxlestage
  deploymentTarget:
    # iOS 26. Pour abaisser la cible, passez plutôt par Xcode :
    # projet HemiFit, onglet General, Minimum Deployments.
    iOS: "26.0"
  xcodeVersion: "26.6"
settings:
  base:
    # Mode de langage Swift attendu par Xcode, pas la version du
    # compilateur : Xcode 26.6 fournit Swift 6.3 et compile en mode 6.
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: HemiFit
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  HemiFit:
    type: application
    platform: iOS
    sources:
      - HemiFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.hemifit
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
